name: Android preview build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve locked dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Build Android preview APK
        working-directory: mobile
        run: flutter build apk --debug
      - name: Prepare preview download
        run: |
          mkdir -p preview
          cp mobile/build/app/outputs/flutter-apk/app-debug.apk preview/Borderless-Local-0.9.2-preview.apk
          printf '%s\n' 'Android preview only; not a Play Store release.' 'This build uses a temporary CI debug certificate. It may not install over a previous locally signed APK. Preserve saved data before changing installations.' > preview/README.txt
          cd preview
          sha256sum Borderless-Local-0.9.2-preview.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Borderless-Local-Android-0.9.2-preview
          path: preview/
          if-no-files-found: error
          retention-days: 14
